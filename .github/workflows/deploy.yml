name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  pages:
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      id-token: write

    steps:
      # 1) checkout
      - uses: actions/checkout@v4

      # 2) instala Node (22 LTS; o 18 saiu de suporte em abr/2025) e dependências, com cache do npm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # 3) build
      - name: Build with Astro
        run: npm run build

      # 4) envia o dist/ como artefato para o Pages
      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # 5) publica o site no GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
